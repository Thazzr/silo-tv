# Publishes a GitHub release when a version tag (vX.Y.Z) is pushed. The release carries the .ipk built
# from the tag, its SHA-256 and the third-party license notices; the notes are the tag's annotation
# followed by git-cliff's section for this version. While the major version is 0 the release is
# marked as a pre-release. The tag, package.json, appinfo.json, the service and the lock file must
# agree (scripts/release-check.mjs), and the full gate must be green: a release never ships without it.
# No secrets beyond the workflow's own token; the tag push itself is the approval.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish the release
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      CI: 'true'
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # git-cliff reads the tags and the history, so the checkout must not be shallow.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium for the E2E tests
        run: |
          npx playwright install chromium --only-shell
          npx playwright install-deps chromium

      - name: Check that the tag matches the versions
        run: node scripts/release-check.mjs "$TAG"

      - name: Run the gate
        run: pwsh -NoProfile -File tools/verify.ps1

      - name: Checksum the .ipk
        run: |
          count=$(ls out/*.ipk | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "Expected exactly one .ipk in out/, found $count" >&2
            exit 1
          fi
          cd out
          for file in *.ipk; do sha256sum "$file" > "$file.sha256"; done

      - name: Write the release notes
        run: |
          {
            git for-each-ref "refs/tags/$TAG" --format='%(contents)'
            echo
            npx --no-install git-cliff -c cliff.toml --latest --strip header
          } > notes.md

      - name: Create the release
        run: |
          prerelease=()
          version="${TAG#v}"
          if [ "${version%%.*}" = "0" ]; then
            prerelease=(--prerelease)
          fi
          gh release create "$TAG" --verify-tag --title "silo-tv $version" --notes-file notes.md "${prerelease[@]}" \
            out/*.ipk out/*.ipk.sha256 dist/THIRD_PARTY_NOTICES.txt

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: reports/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: warn
