# Publishes a GitHub release when a version tag (vX.Y.Z) is pushed. The release carries the .ipk built
# from the tag, its SHA-256 and the third-party license notices; the notes are the tag's annotation
# followed by git-cliff's section for this version. A tag with a SemVer pre-release suffix
# (v0.4.0-rc.1) makes it a pre-release; every other tag is a normal release and the "Latest" one.
# The tag, package.json, appinfo.json, the service and the lock file must
# agree (scripts/release-check.mjs), and the full gate must be green: a release never ships without it.
# No secrets beyond the workflow's own token; the tag push itself is the approval.
# Two jobs, so that the token that can write to the repository never meets third-party code: "build"
# runs npm ci (install scripts), the tests, the build and Playwright with read-only permissions and no
# token at all; "publish" only downloads the finished files and calls gh, with no checkout and no npm.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      CI: 'true'
      TAG: ${{ github.ref_name }}
    steps:
      # git-cliff reads the tags and the history, so the checkout must not be shallow.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium for the E2E tests
        run: |
          npx playwright install chromium --only-shell
          # install-deps runs apt, and the runner's Ubuntu mirror is sometimes unreachable for a
          # while. Retry twice with a pause; the step fails only when the last attempt fails.
          attempt=1
          until npx playwright install-deps chromium; do
            if [ "$attempt" -ge 3 ]; then
              echo "install-deps failed $attempt times" >&2
              exit 1
            fi
            sleep $((attempt * 30))
            attempt=$((attempt + 1))
          done

      - name: Check that the tag matches the versions
        run: node scripts/release-check.mjs "$TAG"

      - name: Run the gate
        run: pwsh -NoProfile -File tools/verify.ps1

      - name: Checksum the .ipk
        run: |
          count=$(ls out/*.ipk | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "Expected exactly one .ipk in out/, found $count" >&2
            exit 1
          fi
          cd out
          for file in *.ipk; do sha256sum "$file" > "$file.sha256"; done

      - name: Write the release notes
        run: |
          {
            git for-each-ref "refs/tags/$TAG" --format='%(contents)'
            echo
            npx --no-install git-cliff -c cliff.toml --latest --strip header
          } > notes.md

      - name: Upload the release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            out/*.ipk
            out/*.ipk.sha256
            dist/THIRD_PARTY_NOTICES.txt
            notes.md
          retention-days: 7
          if-no-files-found: error

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: reports/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: warn

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # The artifact keeps the paths relative to the workspace root: out/, dist/ and notes.md.
      - name: Download the release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd release
          count=$(ls out/*.ipk | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "Expected exactly one .ipk, found $count" >&2
            exit 1
          fi
          version="${TAG#v}"
          # The version core (X.Y.Z) has no "-", so a "-" marks a SemVer pre-release suffix.
          case "$version" in
            *-*) channel=(--prerelease --latest=false) ;;
            *) channel=(--latest) ;;
          esac
          gh release create "$TAG" --verify-tag --title "silo-tv $version" --notes-file notes.md "${channel[@]}" \
            out/*.ipk out/*.ipk.sha256 dist/THIRD_PARTY_NOTICES.txt
