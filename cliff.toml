# git-cliff configuration — https://git-cliff.org
# Generates CHANGELOG.md from the Conventional Commits history in Keep a Changelog format.
# Regenerate with `pwsh tools/update-changelog.ps1` (see CLAUDE.md -> "After EVERY phase").

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/) and
[Conventional Commits](https://www.conventionalcommits.org/en/v1.0.0/). This file is
generated automatically from the commit messages with [git-cliff](https://git-cliff.org) –
**do not edit it by hand**.

"""

body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{% if commit.breaking %}[**BREAKING**] {% endif %}{{ commit.message | split(pat="\n") | first | trim | upper_first }}\
{% endfor %}
{% endfor %}\n
"""

trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
topo_order = false
sort_commits = "oldest"
tag_pattern = "v[0-9]*"

# Section order via the <!-- N --> prefix (Keep a Changelog: Added, Changed,
# Removed, Fixed, Security). striptags removes the comment again in the output.
commit_parsers = [
  # Pure changelog housekeeping commits stay out of the changelog itself.
  { message = "^(docs|chore)\\(changelog\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix\\(sec", group = "<!-- 4 -->Security" },
  { message = "^sec", group = "<!-- 4 -->Security" },
  { message = "^fix", group = "<!-- 3 -->Fixed" },
  { message = "^perf", group = "<!-- 1 -->Changed" },
  { message = "^refactor", group = "<!-- 1 -->Changed" },
  { message = "^style", group = "<!-- 1 -->Changed" },
  { message = "^docs", group = "<!-- 1 -->Changed" },
  { message = "^test", group = "<!-- 1 -->Changed" },
  { message = "^build", group = "<!-- 1 -->Changed" },
  { message = "^chore", group = "<!-- 1 -->Changed" },
  { message = "^revert", group = "<!-- 2 -->Removed" },
  { message = "^ci", skip = true },
]
